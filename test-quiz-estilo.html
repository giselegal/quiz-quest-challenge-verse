<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - Quiz Estilo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }

        .test-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 800px;
            margin: 0 auto;
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .warning {
            background-color: #fff3cd;
            color: #856404;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="test-container">
        <h1>🧪 Teste - Quiz Estilo (/quiz-estilo)</h1>

        <div id="status"></div>

        <h2>Preview da Página:</h2>
        <iframe src="http://localhost:8080/quiz-estilo" onload="checkPageLoad()" onerror="showError()"></iframe>

        <div style="margin-top: 20px;">
            <h3>Links de Teste:</h3>
            <ul>
                <li><a href="http://localhost:8080/quiz-estilo" target="_blank">🔗 Abrir /quiz-estilo em nova aba</a>
                </li>
                <li><a href="http://localhost:8080/" target="_blank">🏠 Página inicial</a></li>
                <li><a href="http://localhost:8080/dashboard" target="_blank">📊 Dashboard</a></li>
            </ul>
        </div>
    </div>

    <script>
        function showStatus(message, type = 'success') {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.innerHTML = `<strong>${type.toUpperCase()}:</strong> ${message}`;
        }

        function checkPageLoad() {
            showStatus('Página carregou com sucesso! ✅', 'success');

            // Aguardar um pouco e verificar se há erros
            setTimeout(() => {
                try {
                    const iframe = document.querySelector('iframe');
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

                    // Verificar se há mensagens de erro
                    const errorMessages = iframeDoc.querySelectorAll('[class*="error"], [class*="Error"]');
                    const oopsMessages = iframeDoc.body.innerHTML.includes('Oops');
                    const tempMessages = iframeDoc.body.innerHTML.includes('temporariamente');

                    if (oopsMessages || tempMessages) {
                        showStatus('❌ Quiz ainda mostrando mensagem de erro ou indisponibilidade', 'error');
                    } else if (errorMessages.length > 0) {
                        showStatus(`⚠️ Encontrados ${errorMessages.length} elementos com classe de erro`, 'warning');
                    } else {
                        showStatus('✅ Quiz carregado sem erros aparentes!', 'success');
                    }

                } catch (e) {
                    showStatus('⚠️ Não foi possível acessar conteúdo do iframe (CORS)', 'warning');
                }
            }, 2000);
        }

        function showError() {
            showStatus('❌ Erro ao carregar a página', 'error');
        }

        // Status inicial
        showStatus('🔄 Carregando página...', 'warning');
    </script>
</body>

</html>
